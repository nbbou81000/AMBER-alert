name: Fetch AMBER Alerts

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/20 * * * *"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run fetch script
        run: node fetch-amber.js

      - name: Commit and push updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/amber-alerts.json
          git diff --staged --quiet || git commit -m "Update AMBER alerts [skip ci]"
          git push
